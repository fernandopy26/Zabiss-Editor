name: Build Zabiss Editor

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-22.04
            name: Linux
          - os: macos-latest
            name: macOS

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Version: $VERSION"
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p,'utf8'));
            c.version = '$VERSION';
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            console.log('tauri.conf.json version set to', '$VERSION');
          "
          # Atualiza Cargo.toml também (para o get_app_version retornar a versão correta)
          sed -i.bak "s/^version *= *\".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak

      - name: Install npm dependencies
        run: npm install

      - name: Prepare dist folder
        shell: bash
        run: |
          mkdir -p dist
          cp index.html style.css app.js coi-serviceworker.js favicon.svg dist/

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Zabiss Editor ${{ github.ref_name }}
          releaseBody: |
            ## Zabiss Editor ${{ github.ref_name }}

            | Sistema | Arquivo |
            |---------|---------|
            | Windows | `.msi` ou `-setup.exe` |
            | Linux   | `.deb` (Ubuntu) ou `.AppImage` |
            | macOS   | `.dmg` |

            Feito por Neko Studio — nekostudio.contato@gmail.com
          releaseDraft: false
          prerelease: false
