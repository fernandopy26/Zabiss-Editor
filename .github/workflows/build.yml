name: Build Zabiss Editor

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag para buildar (ex: v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-22.04
            name: Linux
          - os: macos-latest
            name: macOS

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Version: $VERSION"
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p,'utf8'));
            c.version = '$VERSION';
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            console.log('tauri.conf.json version set to', '$VERSION');
          "

      - name: Install npm dependencies
        run: npm install

      - name: Prepare dist folder
        shell: bash
        run: |
          mkdir -p dist
          cp index.html style.css app.js coi-serviceworker.js favicon.svg dist/

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Zabiss Editor ${{ github.ref_name }}
          releaseBody: |
            ## Zabiss Editor ${{ github.ref_name }}

            | Sistema | Arquivo |
            |---------|---------|
            | Windows | `.msi` ou `-setup.exe` |
            | Linux   | `.deb` (Ubuntu) ou `.AppImage` |
            | macOS   | `.dmg` |

            Feito por Neko Studio — nekostudio.contato@gmail.com
          releaseDraft: false
          prerelease: false

  # Gera o latest.json para o auto-updater após todos os builds
  updater-json:
    needs: build
    runs-on: ubuntu-latest
    name: Publicar latest.json
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aguardar assets ficarem disponíveis
        run: sleep 20

      - name: Gerar latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/generate-latest-json.py \
            "$VERSION" \
            "$GITHUB_REF_NAME" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_TOKEN"

      - name: Upload latest.json para a release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID=$(curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")

          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @latest.json \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=latest.json"

          echo "latest.json publicado com sucesso"
